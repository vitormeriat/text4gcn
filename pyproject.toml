[tool.poetry]
name = "text4gcn"
version = "2.0.0"
description = "A Python framework for text classification using Graph Neural Networks (GNNs)"
authors = ["Vitor Meriat <vitormeriat@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/vitormeriat/text4gcn"
repository = "https://github.com/vitormeriat/text4gcn"
documentation = "https://github.com/vitormeriat/text4gcn#readme"
keywords = ["graph-neural-networks", "text-classification", "nlp", "machine-learning", "deep-learning", "gcn", "gnn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
license = "MIT"
packages = [{include = "text4gcn"}]

[tool.poetry.dependencies]
python = "^3.10"
# Core dependencies (without PyTorch - will be added via extras)
transformers = "^4.41.1"
scikit-learn = "^1.3.2"
numpy = "^1.24.0"
pandas = "^2.0.0"
# NLP dependencies
nltk = "^3.8.1"
gensim = "^4.3.2"
stanfordcorenlp = "^3.9.1.1"
# Visualization and utilities
matplotlib = "^3.8.2"
tabulate = "^0.9.0"
rich = "^13.0.0"

[tool.poetry.extras]
# PyTorch CPU version (default)
cpu = ["torch>=2.1.2,<2.2.0"]
# PyTorch GPU version (CUDA)
gpu = ["torch>=2.1.2,<2.2.0+cu121"]
# All extras
all = ["torch>=2.1.2,<2.2.0", "torch>=2.1.2,<2.2.0+cu121"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
pre-commit = "^3.4.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.1.0"
sphinx-rtd-theme = "^1.3.0"
myst-parser = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["text4gcn"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=text4gcn",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]