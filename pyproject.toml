[project]
name = "text4gcn"
version = "2.0.0rc2"
description = "A Python framework for text classification using Graph Neural Networks (GNNs)"
authors = [
    {name = "Vitor Meriat", email = "vitormeriat@gmail.com"}
]
readme = "README.md"
license = "MIT"
keywords = ["graph-neural-networks", "text-classification", "nlp", "machine-learning", "deep-learning", "gcn", "gnn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.0.0",
    "requests>=2.31.0",
    "transformers>=4.41.1",
    "scikit-learn>=1.5.2",
    "numpy>=2.1.0",
    "scipy>=1.14.1",
    "pandas>=2.2.3",
    "nltk>=3.8.1",
    "gensim>=4.4.0",
    "matplotlib>=3.9.2",
    "tabulate>=0.9.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
cpu = []
gpu = []
syntactic = [
    "stanfordcorenlp>=3.9.1.1",
]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
[project.urls]
Homepage = "https://github.com/vitormeriat/text4gcn"
Repository = "https://github.com/vitormeriat/text4gcn"
Documentation = "https://vitormeriat.github.io/text4gcn/"

[tool.poetry]
packages = [{include = "text4gcn"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
stanfordcorenlp = {version = ">=3.9.1.1", optional = true}

[tool.poetry.extras]
syntactic = ["stanfordcorenlp"]
cpu = []
gpu = []

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
pre-commit = "^3.4.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.0"
mkdocs-material = "^9.5.0"
mkdocstrings = {version = "^0.24.0", extras = ["python"]}
mkdocs-jupyter = ">=0.24.0,<1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["text4gcn"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# Strict flags deferred until live-path annotations are complete (#10 baseline).
check_untyped_defs = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=text4gcn",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
