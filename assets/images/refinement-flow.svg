<svg viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">

  <rect width="820" height="360" fill="#fafafa" rx="12"/>
  <text x="410" y="30" text-anchor="middle" fill="#263238" font-size="15" font-weight="700">Graph Refinement — Before and After</text>

  <!-- ══════════════════════════════
       LEFT PANEL — before refinement
       ══════════════════════════════ -->
  <rect x="20" y="50" width="350" height="265" rx="10" fill="white" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="195" y="74" text-anchor="middle" fill="#546e7a" font-size="12" font-weight="600">Before refinement</text>

  <!-- noise word nodes (grey, will be removed) -->
  <circle cx="100" cy="130" r="22" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="100" y="126" text-anchor="middle" fill="#9e9e9e" font-size="9">the</text>
  <text x="100" y="137" text-anchor="middle" fill="#9e9e9e" font-size="8">df=4800</text>

  <circle cx="70" cy="200" r="22" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="70" y="196" text-anchor="middle" fill="#9e9e9e" font-size="9">an</text>
  <text x="70" y="207" text-anchor="middle" fill="#9e9e9e" font-size="8">df=3900</text>

  <circle cx="130" cy="260" r="22" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="130" y="256" text-anchor="middle" fill="#9e9e9e" font-size="9">xyz</text>
  <text x="130" y="267" text-anchor="middle" fill="#9e9e9e" font-size="8">df=1</text>

  <!-- noise doc connection (weak edge) -->
  <line x1="220" y1="120" x2="100" y2="130" stroke="#bdbdbd" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="220" y1="120" x2="70"  y2="200" stroke="#bdbdbd" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="280" y1="200" x2="130" y2="260" stroke="#bdbdbd" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- useful word nodes -->
  <circle cx="220" cy="160" r="24" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="220" y="156" text-anchor="middle" fill="#e65100" font-size="10" font-weight="700">graph</text>
  <text x="220" y="168" text-anchor="middle" fill="#bf360c" font-size="8">df=312</text>

  <circle cx="290" cy="230" r="24" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="290" y="226" text-anchor="middle" fill="#e65100" font-size="10" font-weight="700">neural</text>
  <text x="290" y="238" text-anchor="middle" fill="#bf360c" font-size="8">df=280</text>

  <!-- doc nodes -->
  <rect x="170" y="94" width="100" height="36" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.8"/>
  <text x="220" y="116" text-anchor="middle" fill="#1a237e" font-size="10" font-weight="700">Doc 0 (train)</text>

  <rect x="230" y="264" width="100" height="36" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.8"/>
  <text x="280" y="286" text-anchor="middle" fill="#b71c1c" font-size="10" font-weight="700">Doc 1 (test)</text>

  <!-- useful edges -->
  <line x1="220" y1="130" x2="220" y2="136" stroke="#5c6bc0" stroke-width="2.5"/>
  <line x1="240" y1="120" x2="290" y2="206" stroke="#5c6bc0" stroke-width="2"/>
  <line x1="220" y1="184" x2="256" y2="264" stroke="#ef5350" stroke-width="2"/>
  <line x1="290" y1="206" x2="280" y2="264" stroke="#ef5350" stroke-width="2"/>
  <!-- word-word -->
  <line x1="244" y1="162" x2="266" y2="228" stroke="#ff8f00" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- noise labels -->
  <text x="100" y="100" text-anchor="middle" fill="#e53935" font-size="9">stop word</text>
  <text x="70"  y="170" text-anchor="middle" fill="#e53935" font-size="9">stop word</text>
  <text x="130" y="235" text-anchor="middle" fill="#e53935" font-size="9">rare (df=1)</text>

  <!-- stats before -->
  <rect x="30" y="286" width="330" height="22" rx="5" fill="#fce4ec"/>
  <text x="195" y="301" text-anchor="middle" fill="#c62828" font-size="10">12,476 nodes · 380,000 edges · 3 noisy words shown</text>

  <!-- ══════════════════════════
       CENTRE — RefinementConfig
       ══════════════════════════ -->
  <rect x="380" y="120" width="60" height="120" rx="0" fill="none"/>

  <!-- Arrow -->
  <line x1="378" y1="182" x2="438" y2="182" stroke="#546e7a" stroke-width="2.5"/>
  <polygon points="438,182 428,177 428,187" fill="#546e7a"/>

  <!-- Config box -->
  <rect x="385" y="135" width="50" height="90" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="1.2"/>
  <text x="410" y="154" text-anchor="middle" fill="#37474f" font-size="8" font-weight="700">Refinement</text>
  <text x="410" y="166" text-anchor="middle" fill="#37474f" font-size="7">min_doc_freq</text>
  <text x="410" y="176" text-anchor="middle" fill="#37474f" font-size="7">= 2</text>
  <text x="410" y="189" text-anchor="middle" fill="#37474f" font-size="7">max_df_ratio</text>
  <text x="410" y="199" text-anchor="middle" fill="#37474f" font-size="7">= 0.85</text>
  <text x="410" y="212" text-anchor="middle" fill="#37474f" font-size="7">edge_thresh</text>
  <text x="410" y="222" text-anchor="middle" fill="#37474f" font-size="7">= 0.1</text>

  <!-- ══════════════════════════════
       RIGHT PANEL — after refinement
       ══════════════════════════════ -->
  <rect x="450" y="50" width="350" height="265" rx="10" fill="white" stroke="#43a047" stroke-width="2"/>
  <text x="625" y="74" text-anchor="middle" fill="#2e7d32" font-size="12" font-weight="600">After refinement</text>

  <!-- removed nodes shown as faint X marks -->
  <circle cx="500" cy="130" r="20" fill="#ffebee" stroke="#ef9a9a" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="490" y1="120" x2="510" y2="140" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="510" y1="120" x2="490" y2="140" stroke="#ef9a9a" stroke-width="1.5"/>

  <circle cx="470" cy="200" r="20" fill="#ffebee" stroke="#ef9a9a" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="460" y1="190" x2="480" y2="210" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="480" y1="190" x2="460" y2="210" stroke="#ef9a9a" stroke-width="1.5"/>

  <circle cx="530" cy="260" r="20" fill="#ffebee" stroke="#ef9a9a" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="520" y1="250" x2="540" y2="270" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="540" y1="250" x2="520" y2="270" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- kept word nodes (cleaner graph) -->
  <circle cx="640" cy="165" r="26" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.2"/>
  <text x="640" y="161" text-anchor="middle" fill="#e65100" font-size="10" font-weight="700">graph</text>
  <text x="640" y="173" text-anchor="middle" fill="#bf360c" font-size="8">df=312 ✓</text>

  <circle cx="710" cy="235" r="26" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.2"/>
  <text x="710" y="231" text-anchor="middle" fill="#e65100" font-size="10" font-weight="700">neural</text>
  <text x="710" y="243" text-anchor="middle" fill="#bf360c" font-size="8">df=280 ✓</text>

  <!-- doc nodes (always kept) -->
  <rect x="580" y="92" width="110" height="38" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
  <text x="635" y="115" text-anchor="middle" fill="#1a237e" font-size="10" font-weight="700">Doc 0 (train) ✓</text>

  <rect x="598" y="265" width="110" height="38" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="653" y="288" text-anchor="middle" fill="#b71c1c" font-size="10" font-weight="700">Doc 1 (test) ✓</text>

  <!-- cleaner strong edges only -->
  <line x1="635" y1="130" x2="640" y2="139" stroke="#5c6bc0" stroke-width="3"/>
  <line x1="670" y1="116" x2="710" y2="209" stroke="#5c6bc0" stroke-width="2.5"/>
  <line x1="640" y1="191" x2="630" y2="265" stroke="#ef5350" stroke-width="2.5"/>
  <line x1="710" y1="209" x2="700" y2="265" stroke="#ef5350" stroke-width="2.5"/>
  <!-- word-word PMI kept -->
  <line x1="666" y1="167" x2="684" y2="233" stroke="#ff8f00" stroke-width="2.2" stroke-dasharray="5,3"/>

  <!-- X label -->
  <text x="498" y="103" text-anchor="middle" fill="#ef5350" font-size="9">removed</text>
  <text x="466" y="175" text-anchor="middle" fill="#ef5350" font-size="9">removed</text>
  <text x="528" y="237" text-anchor="middle" fill="#ef5350" font-size="9">removed</text>

  <!-- stats after -->
  <rect x="460" y="286" width="330" height="22" rx="5" fill="#e8f5e9"/>
  <text x="625" y="301" text-anchor="middle" fill="#2e7d32" font-size="10">9,831 nodes · 241,000 edges · −21% nodes · −37% edges</text>

  <!-- bottom legend -->
  <rect x="20" y="330" width="780" height="22" rx="6" fill="#eceff1"/>
  <line x1="36" y1="341" x2="56" y2="341" stroke="#5c6bc0" stroke-width="2.5"/>
  <text x="62" y="345" fill="#37474f" font-size="10">TF-IDF edge (kept)</text>
  <line x1="180" y1="341" x2="200" y2="341" stroke="#ff8f00" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="206" y="345" fill="#37474f" font-size="10">PMI edge (kept)</text>
  <line x1="314" y1="341" x2="334" y2="341" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="340" y="345" fill="#37474f" font-size="10">Weak edge (pruned)</text>
  <circle cx="480" cy="341" r="7" fill="#ffebee" stroke="#ef9a9a" stroke-width="1" opacity="0.6"/>
  <text x="494" y="345" fill="#37474f" font-size="10">Node removed</text>
  <rect x="594" y="334" width="40" height="14" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.2"/>
  <text x="614" y="344" text-anchor="middle" fill="#1a237e" font-size="9">Doc ✓</text>
  <text x="640" y="345" fill="#37474f" font-size="10">always kept (keep_docs=True)</text>
</svg>
