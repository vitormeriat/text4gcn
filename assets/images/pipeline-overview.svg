<svg viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="860" height="200" fill="#f8f9fa" rx="12"/>

  <!-- ── Step 1: TextPipeline ── -->
  <rect x="20" y="30" width="180" height="140" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/>
  <rect x="20" y="30" width="180" height="36" rx="10" fill="#5c6bc0"/>
  <rect x="20" y="54" width="180" height="12" fill="#5c6bc0"/>
  <text x="110" y="53" text-anchor="middle" fill="white" font-size="13" font-weight="600">TextPipeline</text>

  <text x="35" y="90" fill="#37474f" font-size="10.5">• Remove stop words</text>
  <text x="35" y="107" fill="#37474f" font-size="10.5">• Filter rare words</text>
  <text x="35" y="124" fill="#37474f" font-size="10.5">• Shuffle train / test</text>
  <text x="35" y="141" fill="#37474f" font-size="10.5">• Build vocabulary</text>
  <text x="35" y="158" fill="#37474f" font-size="10.5">• Node feature matrices</text>

  <!-- Arrow 1 -->
  <g transform="translate(210,100)">
    <line x1="0" y1="0" x2="52" y2="0" stroke="#90a4ae" stroke-width="2"/>
    <polygon points="52,0 42,-5 42,5" fill="#90a4ae"/>
    <text x="26" y="-8" text-anchor="middle" fill="#78909c" font-size="9">.cleaned/</text>
    <text x="26" y="16" text-anchor="middle" fill="#78909c" font-size="9">.node_features/</text>
  </g>

  <!-- ── Step 2: Builder ── -->
  <rect x="272" y="30" width="180" height="140" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <rect x="272" y="30" width="180" height="36" rx="10" fill="#43a047"/>
  <rect x="272" y="54" width="180" height="12" fill="#43a047"/>
  <text x="362" y="53" text-anchor="middle" fill="white" font-size="13" font-weight="600">Builder</text>

  <text x="287" y="90" fill="#37474f" font-size="10.5">Frequency  →  TF-IDF / PMI</text>
  <text x="287" y="110" fill="#37474f" font-size="10.5">Semantic   →  Word2Vec</text>
  <text x="307" y="126" fill="#37474f" font-size="10.5">→  BERT</text>
  <text x="307" y="142" fill="#37474f" font-size="10.5">→  Cosine sim.</text>
  <text x="287" y="162" fill="#37474f" font-size="10.5">Syntactic  →  Dep. parse</text>

  <!-- Arrow 2 -->
  <g transform="translate(462,100)">
    <line x1="0" y1="0" x2="52" y2="0" stroke="#90a4ae" stroke-width="2"/>
    <polygon points="52,0 42,-5 42,5" fill="#90a4ae"/>
    <text x="26" y="-8" text-anchor="middle" fill="#78909c" font-size="9">.adjacency/</text>
    <text x="26" y="16" text-anchor="middle" fill="#78909c" font-size="9">*.adj</text>
  </g>

  <!-- ── Step 3: GNN ── -->
  <rect x="524" y="30" width="180" height="140" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <rect x="524" y="30" width="180" height="36" rx="10" fill="#e53935"/>
  <rect x="524" y="54" width="180" height="12" fill="#e53935"/>
  <text x="614" y="53" text-anchor="middle" fill="white" font-size="13" font-weight="600">GNN</text>

  <text x="539" y="90" fill="#37474f" font-size="10.5">• Load corpus + adjacency</text>
  <text x="539" y="107" fill="#37474f" font-size="10.5">• Optional graph refinement</text>
  <text x="539" y="124" fill="#37474f" font-size="10.5">• Train GCN (Adam)</text>
  <text x="539" y="141" fill="#37474f" font-size="10.5">• Early stopping</text>
  <text x="539" y="158" fill="#37474f" font-size="10.5">• Evaluate on test set</text>

  <!-- Arrow 3 -->
  <g transform="translate(714,100)">
    <line x1="0" y1="0" x2="52" y2="0" stroke="#90a4ae" stroke-width="2"/>
    <polygon points="52,0 42,-5 42,5" fill="#90a4ae"/>
    <text x="26" y="-8" text-anchor="middle" fill="#78909c" font-size="9">TrainingResult</text>
  </g>

  <!-- ── Output ── -->
  <rect x="776" y="65" width="64" height="70" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="808" y="88" text-anchor="middle" fill="#37474f" font-size="9" font-weight="600">accuracy</text>
  <text x="808" y="103" text-anchor="middle" fill="#37474f" font-size="9">loss</text>
  <text x="808" y="118" text-anchor="middle" fill="#37474f" font-size="9">model_path</text>
  <text x="808" y="133" text-anchor="middle" fill="#37474f" font-size="9">epochs</text>

  <!-- Step numbers -->
  <circle cx="20" cy="30" r="0" fill="none"/>
  <text x="110" y="185" text-anchor="middle" fill="#5c6bc0" font-size="11" font-weight="700">Step 1</text>
  <text x="362" y="185" text-anchor="middle" fill="#43a047" font-size="11" font-weight="700">Step 2</text>
  <text x="614" y="185" text-anchor="middle" fill="#e53935" font-size="11" font-weight="700">Step 3</text>
</svg>
