<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">

  <rect width="820" height="380" fill="#fafafa" rx="12"/>
  <text x="410" y="30" text-anchor="middle" fill="#263238" font-size="15" font-weight="700">GCN Information Propagation (2 Layers)</text>

  <!-- ═══════════════════════════════
       COLUMN LABELS
       ═══════════════════════════════ -->
  <text x="120" y="58" text-anchor="middle" fill="#546e7a" font-size="12" font-weight="600">Input graph</text>
  <text x="390" y="58" text-anchor="middle" fill="#546e7a" font-size="12" font-weight="600">After Layer 1</text>
  <text x="660" y="58" text-anchor="middle" fill="#546e7a" font-size="12" font-weight="600">After Layer 2</text>

  <!-- ═══════════════════════════════
       COLUMN 1 — raw input
       ═══════════════════════════════ -->

  <!-- edges col1 -->
  <line x1="120" y1="125" x2="120" y2="195" stroke="#b0bec5" stroke-width="1.5"/>
  <line x1="120" y1="195" x2="120" y2="265" stroke="#b0bec5" stroke-width="1.5"/>
  <line x1="120" y1="125" x2="80"  y2="265" stroke="#b0bec5" stroke-width="1.5"/>
  <line x1="120" y1="195" x2="160" y2="265" stroke="#b0bec5" stroke-width="1.5"/>
  <line x1="80"  y1="265" x2="120" y2="265" stroke="#b0bec5" stroke-width="1.5"/>
  <line x1="120" y1="265" x2="160" y2="265" stroke="#b0bec5" stroke-width="1.5"/>

  <!-- doc node col1 -->
  <rect x="84" y="105" width="72" height="40" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.8"/>
  <text x="120" y="129" text-anchor="middle" fill="#1a237e" font-size="10" font-weight="700">Doc 0</text>
  <text x="120" y="140" text-anchor="middle" fill="#7986cb" font-size="8">x = TF-IDF</text>

  <!-- word nodes col1 -->
  <circle cx="120" cy="195" r="22" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.8"/>
  <text x="120" y="191" text-anchor="middle" fill="#e65100" font-size="9" font-weight="700">graph</text>
  <text x="120" y="203" text-anchor="middle" fill="#bf360c" font-size="8">w₀</text>

  <circle cx="80"  cy="265" r="22" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.8"/>
  <text x="80"  y="261" text-anchor="middle" fill="#e65100" font-size="9" font-weight="700">neural</text>
  <text x="80"  y="273" text-anchor="middle" fill="#bf360c" font-size="8">w₁</text>

  <circle cx="120" cy="265" r="22" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.8"/>
  <text x="120" y="261" text-anchor="middle" fill="#e65100" font-size="9" font-weight="700">network</text>
  <text x="120" y="273" text-anchor="middle" fill="#bf360c" font-size="8">w₂</text>

  <circle cx="160" cy="265" r="22" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.8"/>
  <text x="160" y="261" text-anchor="middle" fill="#e65100" font-size="9" font-weight="700">text</text>
  <text x="160" y="273" text-anchor="middle" fill="#bf360c" font-size="8">w₃</text>

  <!-- caption col1 -->
  <text x="120" y="318" text-anchor="middle" fill="#78909c" font-size="10">Each node holds its</text>
  <text x="120" y="332" text-anchor="middle" fill="#78909c" font-size="10">own initial features</text>

  <!-- ═══════════════════════════════
       ARROW 1→2
       ═══════════════════════════════ -->
  <line x1="215" y1="195" x2="275" y2="195" stroke="#90a4ae" stroke-width="2"/>
  <polygon points="275,195 265,190 265,200" fill="#90a4ae"/>
  <text x="245" y="186" text-anchor="middle" fill="#546e7a" font-size="10">σ(ÃXW₀)</text>

  <!-- ═══════════════════════════════
       COLUMN 2 — after layer 1
       ═══════════════════════════════ -->

  <!-- edges col2 (same topology, highlighted) -->
  <line x1="390" y1="125" x2="390" y2="195" stroke="#5c6bc0" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="390" y1="195" x2="390" y2="265" stroke="#5c6bc0" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="390" y1="125" x2="350" y2="265" stroke="#5c6bc0" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="390" y1="195" x2="430" y2="265" stroke="#5c6bc0" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="350" y1="265" x2="390" y2="265" stroke="#5c6bc0" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="390" y1="265" x2="430" y2="265" stroke="#5c6bc0" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- aggregation glow on doc node -->
  <rect x="350" y="101" width="80" height="48" rx="8" fill="#c5cae9" stroke="#283593" stroke-width="2"/>
  <text x="390" y="122" text-anchor="middle" fill="#1a237e" font-size="10" font-weight="700">Doc 0</text>
  <text x="390" y="135" text-anchor="middle" fill="#283593" font-size="8">aggregates</text>
  <text x="390" y="145" text-anchor="middle" fill="#283593" font-size="8">word features</text>

  <!-- word nodes col2 (slightly enriched color) -->
  <circle cx="390" cy="195" r="22" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="390" y="191" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">graph</text>
  <text x="390" y="204" text-anchor="middle" fill="#bf360c" font-size="8">h¹</text>

  <circle cx="350" cy="265" r="22" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="350" y="261" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">neural</text>
  <text x="350" y="274" text-anchor="middle" fill="#bf360c" font-size="8">h¹</text>

  <circle cx="390" cy="265" r="22" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="390" y="261" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">network</text>
  <text x="390" y="274" text-anchor="middle" fill="#bf360c" font-size="8">h¹</text>

  <circle cx="430" cy="265" r="22" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="430" y="261" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">text</text>
  <text x="430" y="274" text-anchor="middle" fill="#bf360c" font-size="8">h¹</text>

  <!-- caption col2 -->
  <text x="390" y="318" text-anchor="middle" fill="#78909c" font-size="10">Each node aggregates</text>
  <text x="390" y="332" text-anchor="middle" fill="#78909c" font-size="10">1-hop neighbourhood</text>

  <!-- ═══════════════════════════════
       ARROW 2→3
       ═══════════════════════════════ -->
  <line x1="485" y1="195" x2="545" y2="195" stroke="#90a4ae" stroke-width="2"/>
  <polygon points="545,195 535,190 535,200" fill="#90a4ae"/>
  <text x="515" y="186" text-anchor="middle" fill="#546e7a" font-size="10">σ(ÃH¹W₁)</text>

  <!-- ═══════════════════════════════
       COLUMN 3 — after layer 2 → classify
       ═══════════════════════════════ -->

  <!-- edges col3 -->
  <line x1="660" y1="125" x2="660" y2="195" stroke="#283593" stroke-width="2.2" stroke-opacity="0.7"/>
  <line x1="660" y1="195" x2="660" y2="265" stroke="#283593" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="660" y1="125" x2="620" y2="265" stroke="#283593" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="660" y1="195" x2="700" y2="265" stroke="#283593" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="620" y1="265" x2="660" y2="265" stroke="#283593" stroke-width="1.2" stroke-opacity="0.4"/>
  <line x1="660" y1="265" x2="700" y2="265" stroke="#283593" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- classified doc node -->
  <rect x="620" y="97" width="80" height="56" rx="8" fill="#3949ab" stroke="#1a237e" stroke-width="2"/>
  <text x="660" y="118" text-anchor="middle" fill="white" font-size="10" font-weight="700">Doc 0</text>
  <text x="660" y="132" text-anchor="middle" fill="#c5cae9" font-size="8">label: tech ✓</text>
  <text x="660" y="144" text-anchor="middle" fill="#c5cae9" font-size="8">softmax(h²W)</text>

  <!-- word nodes col3 -->
  <circle cx="660" cy="195" r="22" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="660" y="191" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">graph</text>
  <text x="660" y="204" text-anchor="middle" fill="#bf360c" font-size="8">h²</text>

  <circle cx="620" cy="265" r="22" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="620" y="261" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">neural</text>
  <text x="620" y="274" text-anchor="middle" fill="#bf360c" font-size="8">h²</text>

  <circle cx="660" cy="265" r="22" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="660" y="261" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">network</text>
  <text x="660" y="274" text-anchor="middle" fill="#bf360c" font-size="8">h²</text>

  <circle cx="700" cy="265" r="22" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="700" y="261" text-anchor="middle" fill="#bf360c" font-size="9" font-weight="700">text</text>
  <text x="700" y="274" text-anchor="middle" fill="#bf360c" font-size="8">h²</text>

  <!-- caption col3 -->
  <text x="660" y="318" text-anchor="middle" fill="#78909c" font-size="10">Doc node encodes 2-hop</text>
  <text x="660" y="332" text-anchor="middle" fill="#78909c" font-size="10">context → classify</text>

  <!-- ═══════════════════════════════
       LEGEND
       ═══════════════════════════════ -->
  <rect x="30" y="355" width="760" height="18" rx="4" fill="none"/>
  <text x="410" y="368" text-anchor="middle" fill="#90a4ae" font-size="10">Ã = symmetrically normalised adjacency  ·  W₀, W₁ = learnable weight matrices  ·  σ = ReLU</text>
</svg>
