name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root --with dev

    - name: Install project
      run: poetry install --no-interaction --with dev

    - name: Lint (flake8 — critical + style on package)
      run: |
        poetry run flake8 text4gcn \
          --max-line-length=100 \
          --count \
          --select=E9,F63,F7,F82,F821,E722,F401,F841

    - name: Type check (mypy)
      continue-on-error: true
      run: poetry run mypy text4gcn --ignore-missing-imports
      # Soft gate: remaining annotation debt tracked as plan #10.
      # flake8 (F821) and pytest are the hard quality gates.

    - name: Academic rigor + core tests
      run: |
        poetry run pytest \
          tests/test_academic_rigor_a0.py \
          tests/test_graph_refinement.py \
          tests/test_graph_stats_a1.py \
          tests/test_models.py \
          tests/test_integration.py \
          tests/test_builder.py \
          tests/test_dataset.py \
          tests/test_device.py \
          -q -o addopts= --tb=short

    - name: Reproduce script smoke
      run: poetry run python scripts/reproduce_dcai2022.py --reference-only

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: poetry install --no-interaction --no-root

    - name: Build package
      run: poetry build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/
